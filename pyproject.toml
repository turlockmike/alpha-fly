[project]
name = "chessfly"
version = "0.1.0"
description = "AlphaZero-style self-play training of a chess network constrained to the MaleCNS fruit-fly connectome"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",
    "numpy",
    "pandas",
    "pyarrow",
    "chess",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chessfly"]

# RTX 50-series (Blackwell, sm_120) needs the CUDA 12.8 wheels
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
